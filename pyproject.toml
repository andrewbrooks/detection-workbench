[project]
name = "detection-workbench"
version = "0.1.0"
description = "Offline detection-engineering workbench exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ids", "snort", "mcp", "detection-engineering", "pcap", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["mcp>=2", "dpkt>=1.9.8"]

[project.scripts]
detection-workbench = "detection_workbench.server:main"

[project.urls]
Homepage = "https://github.com/andrewbrooks/detection-workbench"
Issues = "https://github.com/andrewbrooks/detection-workbench/issues"
Changelog = "https://github.com/andrewbrooks/detection-workbench/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "scapy>=2.5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detection_workbench"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F", "B", "UP", "SIM", "C4", "I"]
ignore = ["E501", "SIM108", "B008", "UP037"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Snort or Docker (set DW_INTEGRATION=1)"]
